[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nqml"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
  "databento>=0.86",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "tabulate>=0.9",
  "lightgbm>=4.3",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["nqml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
